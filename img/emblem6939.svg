<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="Georgia,serif">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a0"/><stop offset=".5" stop-color="#d9b44a"/><stop offset="1" stop-color="#9c7a22"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c2746"/><stop offset="1" stop-color="#4e1229"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e77c2"/><stop offset="1" stop-color="#0d3a6e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef3f8"/><stop offset=".5" stop-color="#b9c8d6"/><stop offset="1" stop-color="#7e93a6"/>
    </linearGradient>
    <path id="shield" d="M100,60 h280 v190 q0,120 -140,170 q-140,-50 -140,-170 z"/>
    <clipPath id="clipShield"><use href="#shield"/></clipPath>
  </defs>

  <!-- казачьи шашки остриём вверх по сторонам -->
  <g id="sabres">
    <g transform="translate(66,300) rotate(-8)">
      <path d="M0,-210 q10,-40 4,-80 l-8,0 q-6,40 4,80 z" fill="url(#steel)" stroke="#5c6f80" stroke-width="2"/>
      <rect x="-7" y="-212" width="14" height="10" rx="4" fill="url(#gold)"/>
      <path d="M-5,-8 h10 v70 q0,10 -6,16 l-4,0 q-4,-8 -4,-16 z" fill="url(#gold)" stroke="#7a5c14"/>
      <path d="M-14,-6 h28 v8 h-28 z" fill="url(#gold)"/>
      <circle cx="0" cy="86" r="7" fill="url(#gold)" stroke="#7a5c14"/>
    </g>
    <g transform="translate(414,300) scale(-1,1) rotate(-8)">
      <path d="M0,-210 q10,-40 4,-80 l-8,0 q-6,40 4,80 z" fill="url(#steel)" stroke="#5c6f80" stroke-width="2"/>
      <rect x="-7" y="-212" width="14" height="10" rx="4" fill="url(#gold)"/>
      <path d="M-5,-8 h10 v70 q0,10 -6,16 l-4,0 q-4,-8 -4,-16 z" fill="url(#gold)" stroke="#7a5c14"/>
      <path d="M-14,-6 h28 v8 h-28 z" fill="url(#gold)"/>
      <circle cx="0" cy="86" r="7" fill="url(#gold)" stroke="#7a5c14"/>
    </g>
  </g>

  <!-- щит: краповое поле, золотая кайма -->
  <use href="#shield" fill="url(#field)" stroke="url(#gold)" stroke-width="12"/>

  <g clip-path="url(#clipShield)">
    <!-- синяя оконечность (море) -->
    <path d="M100,330 q60,-14 140,0 t140,0 v160 h-280 z" fill="url(#sea)"/>
    <path d="M100,344 q60,-14 140,0 t140,0" stroke="#9fd0ff" stroke-width="4" fill="none" opacity=".7"/>
    <path d="M100,362 q60,-14 140,0 t140,0" stroke="#cfeaff" stroke-width="3" fill="none" opacity=".45"/>

    <!-- золотой мост -->
    <g fill="url(#gold)" stroke="#7a5c14" stroke-width="3">
      <path d="M120,340 q120,-52 240,0 l0,14 q-120,-48 -240,0 z"/>
      <rect x="150" y="330" width="14" height="46"/><rect x="233" y="316" width="14" height="60"/><rect x="316" y="330" width="14" height="46"/>
      <path d="M132,318 h216 v8 h-216 z" rx="4"/>
    </g>

    <!-- золотой грифон на задних лапах с ключом -->
    <g fill="url(#gold)" stroke="#7a5c14" stroke-width="3" stroke-linejoin="round">
      <!-- хвост -->
      <path d="M300,262 q46,-6 58,-44 q-6,34 -22,48 q18,-4 26,-24 q-4,28 -26,36 q-18,6 -36,-4 z"/>
      <!-- туловище -->
      <path d="M208,152 q52,-10 84,32 q22,32 12,78 q-6,28 -34,38 l-72,0 q-26,-12 -28,-44 q-4,-64 38,-102 z"/>
      <!-- крыло -->
      <path d="M236,168 q52,-40 84,-24 q-24,4 -34,20 q28,-8 44,6 q-26,2 -38,16 q24,0 34,14 q-46,10 -90,-32 z"/>
      <!-- шея и голова с клювом и ушком -->
      <path d="M212,158 q-26,-6 -34,-34 q-4,-26 16,-40 q10,-8 26,-6 l10,-16 q2,14 12,16 q-8,8 -6,18 q16,4 20,20 q-2,22 -24,30 z"/>
      <path d="M186,96 q-22,2 -30,16 q16,4 30,-4 z"/>
      <!-- передние лапы держат ключ -->
      <path d="M208,196 q-30,10 -44,34 q14,4 26,-2 q-12,16 -6,30 q18,-8 26,-24 z"/>
      <path d="M262,206 q26,12 34,34 q-14,6 -26,0 q12,14 8,30 q-18,-6 -26,-22 z"/>
      <!-- задние лапы -->
      <path d="M216,296 l-6,34 q-2,10 8,10 l20,0 q-12,-16 -6,-42 z"/>
      <path d="M272,296 l6,34 q2,10 -8,10 l-20,0 q12,-16 6,-42 z"/>
    </g>
    <!-- глаз грифона -->
    <circle cx="200" cy="106" r="4" fill="#3a0c1c"/>
    <!-- золотой ключ в передних лапах -->
    <g stroke="url(#gold)" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M170,180 L292,268"/>
    </g>
    <circle cx="164" cy="174" r="17" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <g stroke="url(#gold)" stroke-width="7" stroke-linecap="round">
      <path d="M282,262 l14,-12 M292,270 l14,-12"/>
    </g>

    <!-- эмблема войск национальной гвардии над щитом (двуглавый орёл стилизованно) -->
    <g transform="translate(240,66) scale(.62)" fill="url(#gold)" stroke="#7a5c14" stroke-width="2.5">
      <path d="M0,-40 q-18,-16 -34,-8 q10,2 12,10 q-14,-2 -20,8 q14,-2 18,6 l8,18 q10,10 16,4 q6,6 16,-4 l8,-18 q4,-8 18,-6 q-6,-10 -20,-8 q2,-8 12,-10 q-16,-8 -34,8 z"/>
      <circle cx="0" cy="14" r="12" fill="url(#field)" stroke="url(#gold)" stroke-width="4"/>
      <path d="M0,2 l3,7 h-6 z" fill="url(#gold)" stroke="none"/>
    </g>
  </g>

  <!-- краповая девизная лента, перевивающая шашки -->
  <path d="M60,470 q180,-34 360,0 l0,44 q-180,-34 -360,0 z" fill="url(#field)" stroke="#2f0a17" stroke-width="3"/>
  <path d="M60,470 l-26,-14 l6,32 z M420,470 l26,-14 l-6,32 z" fill="#3f1022"/>
  <text x="240" y="502" text-anchor="middle" font-size="27" letter-spacing="4" fill="url(#gold)" font-weight="bold">ВСЕГДА НА СТРАЖЕ</text>
</svg>
